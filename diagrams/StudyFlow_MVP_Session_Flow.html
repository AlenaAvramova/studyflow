<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyFlow - Study Session Flow</title>
    <style>
        body { font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; background:linear-gradient(135deg,#56AB2F 0%,#A8E063 100%); display:flex; justify-content:center; align-items:center; min-height:100vh; margin:0; padding:20px; box-sizing:border-box; }
        .container { background:white; border-radius:12px; box-shadow:0 20px 60px rgba(0,0,0,.3); padding:40px; max-width:900px; width:100%; }
        h1 { text-align:center; color:#333; margin-bottom:30px; font-size:28px; }
        svg { width:100%; height:auto; display:block; }
        @media(max-width:650px) { body{padding:10px} .container{padding:15px} h1{font-size:21px} }
    </style>
</head>
<body>
<div class="container">
    <h1>StudyFlow - Study Session Flow</h1>
    <svg viewBox="0 0 900 1680" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="StudyFlow session flow with secure login, session configuration, Spring Boot controller and service, browser timer, pause and resume, early stop, database persistence, break between sessions, daily statistics scheduler, and summary.">
        <defs><marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><polygon points="0 0,10 3,0 6" fill="#333"/></marker></defs>

        <text x="450" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#333">START STUDY SESSION</text>
        <circle cx="450" cy="70" r="25" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>
        <text x="450" y="75" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Start</text>
        <path d="M450 95 V125" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

        <!-- Authentication (part of the three-month project) -->
        <rect x="275" y="125" width="350" height="100" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2" rx="5"/>
        <text x="450" y="149" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">Register or Log In</text>
        <text x="450" y="169" text-anchor="middle" font-size="10" fill="#1B5E20">AuthController + Spring Security</text>
        <text x="450" y="187" text-anchor="middle" font-size="10" fill="#1B5E20">Verify credentials / secure password hashing</text>
        <text x="450" y="205" text-anchor="middle" font-size="10" fill="#1B5E20">Only authenticated users continue</text>
        <path d="M450 225 V255" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

        <!-- Session setup -->
        <rect x="270" y="255" width="360" height="90" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2" rx="5"/>
        <text x="450" y="280" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">Choose study settings</text>
        <text x="450" y="301" text-anchor="middle" font-size="10" fill="#1B5E20">Optional task, focus minutes, number of sessions</text>
        <text x="450" y="321" text-anchor="middle" font-size="10" fill="#1B5E20">Custom break duration / suggested break</text>
        <path d="M450 345 V380" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

        <rect x="275" y="380" width="350" height="78" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2" rx="5"/>
        <text x="450" y="405" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">SessionController</text>
        <text x="450" y="425" text-anchor="middle" font-size="10" fill="#1B5E20">POST /api/v1/sessions</text>
        <text x="450" y="443" text-anchor="middle" font-size="10" fill="#1B5E20">{taskId, planId, focusMinutes}</text>
        <path d="M450 458 V490" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

        <!-- Technical service details mirror the original flowchart -->
        <rect x="235" y="490" width="430" height="197" fill="#E1F5FE" stroke="#01579B" stroke-width="2" rx="5"/>
        <text x="450" y="515" text-anchor="middle" font-size="13" font-weight="bold" fill="#01579B">SessionService.startSession()</text>
        <text x="255" y="544" font-size="11" font-weight="bold" fill="#01579B">1. Validate logged-in user, plan and optional task</text>
        <text x="255" y="568" font-size="11" font-weight="bold" fill="#01579B">2. Create STUDY_SESSIONS record:</text>
        <text x="275" y="589" font-size="10" fill="#01579B">• plan_id, task_id (optional), session_number</text>
        <text x="275" y="607" font-size="10" fill="#01579B">• started_at = NOW; status = ACTIVE</text>
        <text x="275" y="625" font-size="10" fill="#01579B">• planned_minutes = chosen focus duration</text>
        <text x="255" y="654" font-size="11" font-weight="bold" fill="#01579B">3. Save using SessionRepository (Spring Data JPA)</text>
        <rect x="18" y="510" width="195" height="145" fill="#FFECB3" stroke="#F57F17" stroke-width="2" rx="5"/>
        <text x="115" y="535" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C4B00">Spring Scheduler</text>
        <text x="115" y="558" text-anchor="middle" font-size="10" fill="#7C4B00">Runs separately:</text>
        <text x="115" y="582" text-anchor="middle" font-size="10" fill="#7C4B00">Calculate daily</text>
        <text x="115" y="599" text-anchor="middle" font-size="10" fill="#7C4B00">study statistics</text>
        <text x="115" y="630" text-anchor="middle" font-size="9" fill="#7C4B00">(Scheduled background job)</text>
        <path d="M450 687 V720" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

        <rect x="275" y="720" width="350" height="74" fill="#81C784" stroke="#2E7D32" stroke-width="2" rx="5"/>
        <text x="450" y="746" text-anchor="middle" font-size="12" font-weight="bold" fill="#fff">Web Browser - Focus Timer</text>
        <text x="450" y="768" text-anchor="middle" font-size="10" fill="#fff">JavaScript counts down; user studies</text>
        <path d="M450 794 V830" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

        <polygon points="450,830 555,883 450,936 345,883" fill="#FFECB3" stroke="#F57F17" stroke-width="2"/>
        <text x="450" y="880" text-anchor="middle" font-size="12" font-weight="bold" fill="#7C4B00">Pause?</text>
        <path d="M555 883 H665" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        <text x="596" y="870" font-size="11" font-weight="bold" fill="#333">Yes</text>
        <rect x="665" y="842" width="195" height="78" fill="#FFE082" stroke="#F57F17" stroke-width="2" rx="5"/>
        <text x="762" y="867" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C4B00">Pause timer</text>
        <text x="762" y="885" text-anchor="middle" font-size="10" fill="#7C4B00">Exclude paused time</text>
        <text x="762" y="903" text-anchor="middle" font-size="10" fill="#7C4B00">Resume when ready</text>
        <path d="M762 842 V757 H625" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        <text x="765" y="817" font-size="10" fill="#333">Resume</text>
        <path d="M450 936 V973" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        <text x="460" y="955" font-size="11" font-weight="bold" fill="#333">No</text>

        <polygon points="450,973 565,1030 450,1087 335,1030" fill="#FFECB3" stroke="#F57F17" stroke-width="2"/>
        <text x="450" y="1026" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C4B00">Stopped early</text>
        <text x="450" y="1042" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C4B00">or timer finished?</text>
        <path d="M335 1030 H165 V757 H275" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        <text x="191" y="1018" font-size="10" fill="#333">Neither: keep running</text>
        <path d="M450 1087 V1120" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        <text x="461" y="1106" font-size="10" fill="#333">Yes</text>

        <rect x="275" y="1120" width="350" height="75" fill="#FFCDD2" stroke="#D32F2F" stroke-width="2" rx="5"/>
        <text x="450" y="1145" text-anchor="middle" font-size="12" font-weight="bold" fill="#C62828">SessionController</text>
        <text x="450" y="1166" text-anchor="middle" font-size="10" fill="#C62828">PUT /api/v1/sessions/{id}</text>
        <text x="450" y="1183" text-anchor="middle" font-size="10" fill="#C62828">{action: STOP or COMPLETE}</text>
        <path d="M450 1195 V1225" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

        <rect x="235" y="1225" width="430" height="155" fill="#EF9A9A" stroke="#C62828" stroke-width="2" rx="5"/>
        <text x="450" y="1251" text-anchor="middle" font-size="13" font-weight="bold" fill="#fff">SessionService.endSession()</text>
        <text x="255" y="1276" font-size="11" fill="#fff">1. Fetch session and verify ownership</text>
        <text x="255" y="1299" font-size="11" fill="#fff">2. Calculate actual focus time (exclude pauses)</text>
        <text x="255" y="1322" font-size="11" fill="#fff">3. Save ended_at, duration and final status</text>
        <text x="255" y="1345" font-size="11" fill="#fff">4. Update task / totals via SessionRepository</text>
        <path d="M450 1380 V1410" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

        <rect x="265" y="1410" width="370" height="60" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2" rx="5"/>
        <text x="450" y="1435" text-anchor="middle" font-size="12" font-weight="bold" fill="#1B5E20">Database Updates</text>
        <text x="450" y="1455" text-anchor="middle" font-size="10" fill="#1B5E20">STUDY_SESSIONS / TASKS / SESSION_BREAKS</text>
        <path d="M450 1470 V1490" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>

        <polygon points="450,1490 557,1536 450,1582 343,1536" fill="#FFECB3" stroke="#F57F17" stroke-width="2"/>
        <text x="450" y="1533" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C4B00">More planned</text>
        <text x="450" y="1548" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C4B00">sessions?</text>
        <path d="M557 1536 H665" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        <text x="601" y="1523" font-size="10" fill="#333">Yes</text>
        <rect x="665" y="1495" width="195" height="82" fill="#FFE082" stroke="#F57F17" stroke-width="2" rx="5"/>
        <text x="762" y="1520" text-anchor="middle" font-size="11" font-weight="bold" fill="#7C4B00">Break timer</text>
        <text x="762" y="1539" text-anchor="middle" font-size="10" fill="#7C4B00">Rest for chosen minutes</text>
        <text x="762" y="1558" text-anchor="middle" font-size="10" fill="#7C4B00">Save break; next session</text>
        <path d="M860 1536 H883 V419 H625" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        <path d="M450 1582 V1602" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrowhead)"/>
        <text x="463" y="1597" font-size="10" fill="#333">No</text>
        <rect x="305" y="1602" width="290" height="46" fill="#C8E6C9" stroke="#2E7D32" stroke-width="2" rx="5"/>
        <text x="450" y="1621" text-anchor="middle" font-size="11" font-weight="bold" fill="#1B5E20">Show study summary</text>
        <text x="450" y="1638" text-anchor="middle" font-size="10" fill="#1B5E20">Focus time + completed sessions</text>
        <circle cx="450" cy="1664" r="12" fill="#4CAF50" stroke="#2E7D32" stroke-width="2"/>

        <!-- No camera checks, notifications, or WebSocket connection are required. -->
    </svg>
</div>
</body>
</html>
